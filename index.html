<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="refresh" content="0; url=outputs/inventario-avanzado/index.html" />
  <title>ControlTI Pro</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", Arial, sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #10213a, #08111f 58%, #050a13);
      color: #eef4ff;
    }
    main {
      width: min(720px, calc(100% - 32px));
      padding: 32px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      background: rgba(12, 22, 40, 0.9);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      text-align: center;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 5vw, 3.5rem);
    }
    p {
      margin: 0 auto 24px;
      max-width: 60ch;
      color: #a9bbda;
      line-height: 1.6;
    }
    a {
      display: inline-block;
      padding: 12px 18px;
      border-radius: 14px;
      background: linear-gradient(135deg, #6fc7ff, #7f8cff);
      color: #05101f;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <h1>ControlTI Pro</h1>
    <p>
      Sistema avanzado de inventario para empresas que administran equipos de computo, consumibles y activos de TI.
    </p>
    <a href="outputs/inventario-avanzado/index.html">Abrir sistema</a>
  </main>
</body>
</html>
